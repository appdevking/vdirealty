<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <title>Test</title>
</head>
<body>
    <h1>JavaScript Test</h1>
    <button id="testBtn">Click Me</button>
    <div id="result"></div>
    
    <script>
        console.log('TEST: JavaScript is running!');
        console.log('TEST: This should appear in console');
        
        document.getElementById('testBtn').addEventListener('click', function() {
            console.log('TEST: Button clicked!');
            document.getElementById('result').innerHTML = 'JavaScript works!';
            alert('JavaScript is working!');
        });
        
        console.log('TEST: Script loaded successfully');
    </script>

<script>
/* Site traffic beacon: counts this page view (page + referrer source only) on our own API. Fire-and-forget; can never affect the page. */
(function () {
  try {
    var payload = JSON.stringify({ page: location.pathname, ref: document.referrer || '' });
    var url = 'https://api.vdirealty.com/api/stats/pageview';
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url, new Blob([payload], { type: 'application/json' }));
    } else if (window.fetch) {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
